name: CI

on:
  # No paths-ignore on push. Branch protection requires the `fast-checks` status on
  # main, and a workflow that never triggers never reports one — so the check sat in
  # "expected" forever and a docs-only push could only land by bypassing the rule as
  # an admin. Anyone else was blocked outright with no way to satisfy it, which
  # contradicts the "docs touch-ups may go direct to main" rule in CLAUDE.md.
  # A minute of CI on a docs commit is what makes that protection rule mean anything.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast checks - runs on every push to main and every PR
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check docs sync
        run: npm run docs:sync-agents:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check unused exports
        run: npm run lint:exports

      - name: Build
        run: npm run build

  # Full tests - runs on PRs OR when src/ changes on main (~2min)
  full-tests:
    runs-on: ubuntu-latest
    needs: fast-checks
    # Run on PRs always, or on push only if src/ files changed
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && contains(join(github.event.commits.*.modified, ','), 'src/')) ||
      (github.event_name == 'push' && contains(join(github.event.commits.*.added, ','), 'src/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  # Service worker update guard (~2min)
  #
  # Unit tests cannot run a service worker and the main e2e suite runs against
  # the dev server, which produces none — so the update path was untestable and
  # untested, and `registerType: 'prompt'` stranded clients on an old build for
  # months. This suite drives the production build in a real browser. It only
  # guards anything if it actually runs, hence a job rather than a manual script.
  service-worker:
    runs-on: ubuntu-latest
    needs: fast-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Service worker update tests
        run: npm run e2e:sw

  # Full browser suite (~10min, serial)
  #
  # 86 tests across 10 specs, on Desktop Chrome and Pixel 5. Written for CI from
  # the start (forbidOnly, retries: 2, workers: 1) but never had a job, so it
  # gated nothing and only ran when someone remembered to run it locally.
  #
  # It needs VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY to boot the app at all —
  # src/lib/supabase.ts throws without them. The 60 tests using the
  # authenticatedPage fixture additionally need E2E_TEST_EMAIL and
  # E2E_TEST_PASSWORD; without those the fixture skips them and the other 26 run.
  #
  # The heavy steps are gated on the Supabase secret being present, so this job
  # stays green and does nothing until the secrets are configured.
  e2e:
    runs-on: ubuntu-latest
    needs: fast-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Browser suite skipped. Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets to enable it, plus E2E_TEST_EMAIL and E2E_TEST_PASSWORD for the 60 authenticated tests."
          fi

      - name: Setup Node.js
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.cfg.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser suite
        if: steps.cfg.outputs.ready == 'true'
        run: npm run e2e -- --reporter=line
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload report on failure
        if: failure() && steps.cfg.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
